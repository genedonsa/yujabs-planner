name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pywebview
      - name: Test
        run: python -m pytest -q tests
      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name "CornBot"
          --icon assets/icon.png
          --add-data "ui:ui" --add-data "assets:assets" --add-data "prompts:prompts"
          desktop.py
      - name: Zip (mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/CornBot.app" "CornBot-mac.zip"
      - name: Zip (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CornBot/* -DestinationPath CornBot-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CornBot-${{ runner.os }}
          path: CornBot-*.zip
