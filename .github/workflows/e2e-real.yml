name: e2e-real

# 실제 채널·실제 유튜브로 회원처럼 화면을 끝까지 눌러 보는 점검 (맥, 사파리 엔진).
# 결과(화면 캡처 + report.json)는 e2e-results 브랜치에 올린다.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: write

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-save playwright@1.49.1
          npx playwright install webkit
      - name: Run
        env:
          HOME_OVERRIDE: e2e_home
        run: |
          export HOME=$PWD/e2e_home && mkdir -p $HOME
          (python tests/e2e/server.py > e2e_server.log 2>&1 &)
          sleep 3
          node tests/e2e/drive.mjs || true
          cp e2e_server.log e2e_out/ || true
      - name: Publish results
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/res && cp -R e2e_out/. /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q && git checkout -q -b e2e-results
          git config user.name "cornbot-e2e"; git config user.email "e2e@users.noreply.github.com"
          git add -A && git commit -q -m "e2e ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" e2e-results
